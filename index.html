<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beru AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial;min-height:100vh}
header{height:70px;padding:15px 22px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}
.status{color:#7cff9b;font-size:13px}
main{max-width:850px;margin:auto;padding:70px 20px;text-align:center}
h1{font-size:55px;margin:0 0 15px;background:linear-gradient(90deg,#fff,#777);color:transparent;background-clip:text}
p{color:#888;font-size:17px}
.box{margin:40px auto;padding:18px;background:#111;border:1px solid #333;border-radius:20px}
textarea{width:100%;height:100px;background:none;border:0;outline:0;color:white;font-size:17px;resize:none}
button{border:0;border-radius:12px;padding:12px 20px;font-weight:bold;cursor:pointer}
.send{background:white;color:black}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}
.card{background:#111;border:1px solid #252525;padding:22px;border-radius:16px}
.card b{display:block;margin-bottom:8px}
.card span{color:#777;font-size:13px}
#result{margin-top:25px;color:#8cffad}
@media(max-width:600px){h1{font-size:43px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo">◉ BERU</div>
<div class="status">● Online</div>
</header>
<main>
<h1>What can I build for you?</h1>
<p>Your personal AI operating system.</p>
<div class="box">
<textarea id="cmd" placeholder="Tell Beru what you want..."></textarea>
<br><br>
<button class="send" onclick="run()">Run Beru →</button>
</div>
<div class="cards">
<div class="card"><b>🌐 Website</b><span>Build websites with AI</span></div>
<div class="card"><b>🎨 Design</b><span>Create graphics and brands</span></div>
<div class="card"><b>⚡ Agent</b><span>Plan and execute tasks</span></div>
</div>
<div id="result"></div>
</main>
<script>
function run(){
let x=document.getElementById("cmd").value;
document.getElementById("result").innerText=x?"Beru is working on: "+x:"Tell Beru what you need 😎";
}
</script>
</body>
  </html>
